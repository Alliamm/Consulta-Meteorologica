<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="codigo.js"></script>
</head>
<body>
    <div class="container">
        <h1>Consulta Meteorológica</h1>
        <form id="formulario">
            <label for="latitude">Latitude (-90 a 90):</label>
		    <input type="number" id="latitude" name="latitude" step="any" min="-90" max="90" required>
		    <label for="longitude">Longitude (-180 a 180):</label>
		    <input type="number" id="longitude" name="longitude" step="any" min="-180" max="180" required>
		    <button type="submit" id="buscar">Buscar</button>
        </form>
        <p id="mensagem" role="status"></p>
	<div id="clima">
		<ul id="resultado"></ul>
	</div>
    </div>
</body>
</html>
